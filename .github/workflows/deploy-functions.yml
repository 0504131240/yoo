name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # These 5 functions are fully superseded by api/ (Vercel): sendPushOnUpdate by
      # api/notify.js (which also respects target/excludeFamIds, unlike this broadcast-
      # to-everyone trigger), dailyBackup + weeklyDebtReminder by api/cron/daily-backup.js,
      # listBackups/restoreFromBackup by api/backups/*.js. Nobody deleted the old Firebase
      # deployment when the migration happened, so it kept running in parallel — every
      # write fired two pushes, one correctly scoped, one not. Deleting them here instead
      # of just deploying nothing, since a --only deploy never removes what's already live.
      - name: Delete superseded Firebase Functions
        run: npx firebase-tools functions:delete sendPushOnUpdate dailyBackup weeklyDebtReminder listBackups restoreFromBackup --project yossi20361 --force
